name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S native -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build/AltGuitarAmpRack_artefacts/Release/Alt Guitar Amp Rack.exe" "dist/Alt Guitar Amp Rack.exe"
          Compress-Archive -Path "dist/Alt Guitar Amp Rack.exe" -DestinationPath "Alt-Guitar-Amp-Rack-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Alt-Guitar-Amp-Rack-Windows
          path: Alt-Guitar-Amp-Rack-Windows.zip
